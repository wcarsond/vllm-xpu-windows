# models-sweep.input.ini - extra vLLM presets for concurrency-sweep.input.py only; same keys and defaults as models.input.ini
# (the router never reads this file, so the service's model list is unchanged). A section here with the same id as one in
# models.input.ini would override it for the sweep only.
# Why (2026-10-21, Carson: "yeah let's use newer models if we can"): Qwen publishes Qwen3.6-27B only as bf16 (54 GB, does
# not fit two B60s) and FP8; raydelossantos/Qwen3.6-27B-GPTQ-Int4 is the same recipe as Qwen's own Qwen3.5-27B-GPTQ-Int4
# (same architecture Qwen3_5ForConditionalGeneration, 4-bit, group 128, sym, no desc_act, attention / MTP / vision left
# unquantized by the same "dynamic" rules; 30.2 GB against 30.3). Checked with concurrency-sweep-candidates.input.py.

[qwen3.6-27b-gptq]
about = Qwen3.6 27B dense, vision, GPTQ int4 (sweep only)
folder = Qwen3.6-27B-GPTQ-Int4
max_len = 65536
tool_parser = qwen3_xml
reasoning_parser = qwen3
think = 0
vision = 1
