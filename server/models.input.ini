[granite-4.2-30b]
order = 10
about = Granite 30B, 4-bit · 44 tok/s · 32K
folder = Granite-4.2-30B-GPTQ-INT4
max_len = 32768
# 2026-10-13: the folder had no chat template (every chat request failed with HTTP 400); chat_template.jinja copied in
# from ibm-granite/granite-4.2-30b, as the model card says it is unchanged. Its tool calls are <tool_call><function=...>,
# which the qwen3_coder parser reads (the model card's own recommendation), not granite4.
tool_parser = qwen3_coder
reasoning_parser = -

