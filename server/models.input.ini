# models.input.ini - the model ids the vLLM router offers on port 11434. One section per id; the id is what VS Code picks.
# The router loads whichever model a request names and swaps when a request names another (one model on the cards at a
# time, two cards tensor split unless tp=1). Edit freely; the router re-reads this file on every /v1/models request.
# Keys: folder (under C:\Users\claude\models-hf, or a full path), tp (2), max_len (32768), util (0.90),
#       tool_parser (hermes), reasoning_parser (- for none), think (0 = no thinking block), dtype (bfloat16),
#       executor (oneproc = both cards in one process, 15-22% faster decode; mp = two processes, the setting before
#       2026-10-13), graphs (full = decode graphs; eager = none, the old setting), max_seqs (16)
#       To put one model back on the old setup: executor = mp and graphs = eager in its section.
# Load times from a cold start, measured 2026-10-11: 27B int4 ~2.5 min, 72B ~2.5 min, Granite ~2 min, 4B ~45 s.
# Models on F: (the spinning disk) add a minute or two to that.

[router]
# loaded at service start; leave empty to load nothing until the first request names a model (RAM stays free)
default =
# the model a request gets when it names none (and nothing is loaded yet)
fallback = qwen3.5-27b
# the port vLLM itself listens on, behind the router (localhost only)
upstream_port = 11435
# unload the loaded model after this many seconds without a request (0 = never); the next request reloads it, ~2.5 min
# for the big ones. Re-read every 15 s, so a change here takes effect without a restart.
idle_unload_s = 600

[qwen3.5-27b]
order = 8
about = 27B dense, vision · 29 tok/s · 64K
folder = Qwen3.5-27B-GPTQ-Int4
max_len = 65536
tool_parser = qwen3_xml
reasoning_parser = qwen3
think = 0
vision = 1

[qwen3.5-27b-thinking]
order = 9
about = 27B dense, vision, thinks · 29 tok/s · 64K
folder = Qwen3.5-27B-GPTQ-Int4
max_len = 65536
