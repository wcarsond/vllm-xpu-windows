# 2026-10-13: Qwen3-Next-80B-A3B (80B total, 3B active per token), Unsloth UD-Q4_K_XL GGUF, on llama.cpp (Vulkan, both
# B60s, all weights on the cards). 70 tok/s decode, 1,720 tok/s prompt reading, ready in ~17 s. 64K context is the most
# that stays on the cards; 128K spills into system RAM and runs at a quarter of the speed.
